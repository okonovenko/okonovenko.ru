<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Иван Оконовенко</title>
<meta name="description" content="Иван Оконовенко — личная страница. Москва.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;800&family=Onest:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#111318;
    --muted:#5b6170;
    --accent:#153ad6;
    --paper:#fbfbfa;
    --line:#e4e4e0;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    font-size:17px; line-height:1.55;
    min-height:100vh; display:flex; flex-direction:column;
    padding:28px 22px 32px;
  }
  .top{
    font-size:12px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--muted);
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  main{flex:1; display:flex; flex-direction:column; justify-content:center; padding:48px 0}
  h1{
    font-family:"Unbounded",system-ui,sans-serif;
    font-weight:800; text-transform:uppercase;
    font-size:clamp(38px,11.5vw,104px); line-height:.95;
    letter-spacing:-.02em; margin:0 0 28px;
  }
  h1 .dot{color:var(--accent)}
  p{max-width:34em; margin:0 0 16px; color:var(--ink)}
  p.lead{font-size:clamp(18px,2.4vw,21px)}
  .muted{color:var(--muted)}
  a{color:var(--accent); text-decoration:none; border-bottom:1px solid rgba(21,58,214,.35)}
  a:hover,a:focus{border-bottom-color:var(--accent)}
  a:focus-visible{outline:2px solid var(--accent); outline-offset:3px; border-radius:2px}
  footer{
    border-top:1px solid var(--line); padding-top:18px;
    display:flex; flex-wrap:wrap; gap:6px 24px; justify-content:space-between;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:13px; color:var(--muted);
  }
  @media (min-width:760px){
    body{padding:40px 56px 44px}
    main{padding:64px 0}
  }
  @media print{
    body{background:#fff; padding:0}
    a{border:0; color:#000}
  }
</style>
</head>
<body>
  <div class="top">Москва</div>

  <main>
    <h1>Иван<br>Оконовенко<span class="dot">.</span></h1>
    <p class="lead">Сайт пересобирается — прежний перестал существовать 3 августа вместе с площадкой, на которой стоял.</p>
    <p class="muted">Пока здесь пусто, пишите на почту — она работает и читается.</p>
  </main>

  <footer>
    <span><a href="mailto:ivan@okonovenko.ru">ivan@okonovenko.ru</a></span>
    <span>okonovenko.ru</span>
  </footer>
</body>
</html>
